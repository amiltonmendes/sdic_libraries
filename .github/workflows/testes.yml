name: testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "python/[dev]"
      - run: python scripts/documentar.py --conferir
      - run: cd python && python -m pytest -q
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          # roxygen2 fixado na versão de Config/roxygen2/version (r/DESCRIPTION): uma versão nova muda o formato do
          # que é gerado (a 8.1.1 agrupou os importFrom do NAMESPACE) e quebraria a conferência sem mudança de código.
          extra-packages: any::testthat, roxygen2@8.1.1
      - name: Ajuda do R em dia com o roxygen
        run: |
          grep -qx 'Config/roxygen2/version: 8.1.1' r/DESCRIPTION || { echo "Atualize roxygen2@ no CI junto com Config/roxygen2/version"; exit 1; }
          Rscript -e 'roxygen2::roxygenise("r")'
          git diff --exit-code -- r/man r/NAMESPACE
      - name: Testes
        run: Rscript -e 'r <- as.data.frame(testthat::test_local("r", reporter = "summary", stop_on_failure = FALSE)); if (sum(r$failed) + sum(r$error) > 0) quit(status = 1)'
